<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabor Andino Fast Food</title>
<style>
:root{--gold:#f4c430;--red:#d62828;--dark:#0d0d0d;--card:#1b1b1b;--green:#25D366}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--dark);color:#fff;line-height:1.45}
header{background:linear-gradient(135deg,#000,#242424);text-align:center;padding:30px 15px}.logo{max-width:500px;width:95%;border-radius:14px}h1,h2,h3{color:var(--gold)}
.lang{position:sticky;top:0;background:#000;padding:10px;text-align:center;z-index:20;border-bottom:1px solid #333}.lang button{padding:9px 16px;margin:4px;border:none;border-radius:20px;cursor:pointer;font-weight:700}
.container{max-width:1150px;margin:auto;padding:22px 15px}.title{border-left:6px solid var(--red);padding-left:12px;margin-top:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--card);padding:16px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.4);margin:8px 0}.price{color:var(--gold);font-weight:bold}.badge{background:var(--red);padding:5px 10px;border-radius:20px;font-size:.8rem}
.add{background:var(--red);color:white;border:0;border-radius:8px;padding:10px 14px;margin-top:10px;cursor:pointer;font-weight:bold}.btn{display:inline-block;background:var(--green);color:white;padding:14px 22px;border-radius:10px;text-decoration:none;font-weight:bold}
.cart{position:fixed;right:15px;bottom:15px;width:330px;max-width:calc(100% - 30px);background:#000;border:2px solid var(--gold);border-radius:16px;padding:15px;z-index:30;box-shadow:0 0 20px #000}.cart h3{margin-top:0}.cart-items{max-height:220px;overflow:auto}.cart-row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #333;padding:6px 0;font-size:.92rem}.remove{background:#333;color:white;border:0;border-radius:5px;cursor:pointer}.whatsapp{width:100%;background:var(--green);color:white;border:0;border-radius:8px;padding:12px;margin-top:10px;font-weight:bold;cursor:pointer}.clear{width:100%;background:#555;color:white;border:0;border-radius:8px;padding:9px;margin-top:8px;cursor:pointer}.small{color:#ddd;font-size:.92rem}
footer{background:#000;text-align:center;padding:28px;margin-top:25px;margin-bottom:250px}@media(max-width:700px){.cart{position:static;width:auto;margin:20px 15px}.container{padding:14px}.logo{width:100%}footer{margin-bottom:0}}
</style>
</head>
<body>
<header>
<img src="logo_sabor_andino.jpg" class="logo" alt="Sabor Andino">
<h1>Sabor Andino Fast Food</h1>
<p data-es="🇻🇪 Sabor Venezolano en Texas 🇺🇸" data-en="🇻🇪 Venezuelan Flavor in Texas 🇺🇸"></p>
<p data-es="Hot Dogs, Hamburguesas, Arepas, Pepitos y Salchipapas preparados al estilo venezolano." data-en="Venezuelan-style hot dogs, burgers, arepas, pepitos and loaded fries."></p>
<a class="btn" href="https://wa.me/14698230192?text=Hola%20quiero%20realizar%20un%20pedido" data-es="Ordenar por WhatsApp" data-en="Order on WhatsApp"></a>
<p data-es="🕒 Todos los días · 6:00 PM – 1:00 AM" data-en="🕒 Open daily · 6:00 PM – 1:00 AM"></p>
</header>
<div class="lang"><button type="button" onclick="setLang('es')">Español</button><button type="button" onclick="setLang('en')">English</button></div>
<div class="container" id="menu"></div>
<div class="cart"><h3 data-es="🛒 Carrito" data-en="🛒 Cart"></h3><div id="cartItems" class="cart-items"></div><p><b data-es="Total:" data-en="Total:"></b> <span id="total">$0</span></p><button class="whatsapp" onclick="sendWhatsApp()" data-es="Enviar pedido por WhatsApp" data-en="Send order by WhatsApp"></button><button class="clear" onclick="clearCart()" data-es="Vaciar carrito" data-en="Clear cart"></button></div>
<footer data-es="Gracias por elegir Sabor Andino. ¡Tu sabor venezolano favorito en Texas!" data-en="Thank you for choosing Sabor Andino. Your favorite Venezuelan flavor in Texas!"></footer>
<script>
let currentLang='es';let cart=[];
const sections=[
{title:{es:'⭐ Más Vendidos',en:'⭐ Best Sellers'},items:[{es:'Hot Dog Especial',en:'Special Hot Dog',price:9,descEs:'Salchicha, jamón, queso, maíz, huevo cocido, ensalada rayada, papitas al hilo y salsas.',descEn:'Sausage, ham, cheese, corn, boiled egg, shredded salad, potato sticks and house sauces.'},{es:'Hamburguesa Especial de Lomito',en:'Beef Tenderloin Special Burger',price:15,descEs:'Con todos los ingredientes premium de la casa.',descEn:'With all premium house ingredients.'},{es:'Pepito Triple',en:'Triple Pepito',price:19,descEs:'Triple proteína con ingredientes premium.',descEn:'Triple protein with premium ingredients.'},{es:'Salchipapas Mixta',en:'Mixed Loaded Fries',price:18,descEs:'Papas fritas, salchicha, dos proteínas, tocineta, maíz, queso rallado y salsas.',descEn:'French fries, sausage, two proteins, bacon, corn, grated cheese and sauces.'}]},
{title:{es:'🌭 Hot Dogs',en:'🌭 Hot Dogs'},items:[{es:'Hot Dog Normal',en:'Classic Hot Dog',price:7,descEs:'Salchicha, ensalada rayada, papitas al hilo, queso parmesano y salsas.',descEn:'Sausage, shredded salad, potato sticks, parmesan cheese and house sauces.'},{es:'Hot Dog Especial',en:'Special Hot Dog',price:9,descEs:'Salchicha, jamón, queso, maíz, huevo cocido, ensalada rayada, papitas al hilo y salsas.',descEn:'Sausage, ham, cheese, corn, boiled egg, shredded salad, potato sticks and house sauces.'}]},
{title:{es:'🍔 Hamburguesas',en:'🍔 Burgers'},items:[{es:'Hamburguesa Normal',en:'Classic Burger',price:10,descEs:'Carne de res, lechuga, tomate, cebolla morada, ensalada rayada, papitas al hilo y salsas.',descEn:'Beef patty, lettuce, tomato, red onion, shredded salad, potato sticks and house sauces.'},{es:'Hamburguesa Especial',en:'Special Burger',price:13,descEs:'Doble carne, jamón, queso, huevo, tocineta, lechuga, tomate, cebolla morada, ensalada rayada, maíz, papitas al hilo y salsas.',descEn:'Double beef patty, ham, cheese, egg, bacon, lettuce, tomato, red onion, shredded salad, corn, potato sticks and house sauces.'}]},
{title:{es:'🍔 Hamburguesas Especiales',en:'🍔 Special Burgers'},note:{es:'Incluyen: lechuga, tomate, cebolla morada, ensalada rayada, jamón, queso, huevo, tocineta, maíz, papitas al hilo y salsas.',en:'Includes: lettuce, tomato, red onion, shredded salad, ham, cheese, egg, bacon, corn, potato sticks and house sauces.'},items:[{es:'Especial de Pollo',en:'Chicken Special Burger',price:13},{es:'Especial de Chuleta Ahumada',en:'Smoked Pork Special Burger',price:14},{es:'Especial de Lomito',en:'Beef Tenderloin Special Burger',price:15},{es:'Especial Mixta',en:'Mixed Special Burger',price:17},{es:'Especial Triple',en:'Triple Special Burger',price:19}]},
{title:{es:'🫓 Arepas',en:'🫓 Arepas'},items:[{es:'Pollo Mechado',en:'Shredded Chicken',price:8},{es:'Carne Mechada',en:'Shredded Beef',price:9},{es:'Salchicha con Huevo',en:'Sausage & Egg',price:8},{es:'Dominó (Caraotas y Queso)',en:'Black Beans & Cheese',price:8}]},
{title:{es:'🥖 Pepitos',en:'🥖 Pepitos'},note:{es:'Incluyen: lechuga, tomate, cebolla morada, ensalada rayada, jamón, queso, huevo, tocineta, maíz, papitas al hilo y salsas.',en:'Includes: lettuce, tomato, red onion, shredded salad, ham, cheese, egg, bacon, corn, potato sticks and house sauces.'},items:[{es:'Pepito de Pollo',en:'Chicken Pepito',price:14},{es:'Pepito de Lomito',en:'Beef Tenderloin Pepito',price:15},{es:'Pepito de Chuleta',en:'Smoked Pork Pepito',price:15},{es:'Pepito Doble',en:'Double Pepito',price:17},{es:'Pepito Triple',en:'Triple Pepito',price:19}]},
{title:{es:'🍟 Salchipapas',en:'🍟 Loaded Fries'},items:[{es:'Salchipapas Sencilla',en:'Classic Loaded Fries',price:13,descEs:'Papas fritas, salchicha, maíz, queso rallado y salsas.',descEn:'French fries, sausage, corn, grated cheese and house sauces.'},{es:'Salchipapas Especial',en:'Special Loaded Fries',price:16,descEs:'Papas fritas, salchicha, una proteína a elección, tocineta, maíz, queso rallado y salsas. Proteínas: carne mechada, lomito, pollo mechado o pollo a la plancha.',descEn:'French fries, sausage, one protein of choice, bacon, corn, grated cheese and house sauces. Proteins: shredded beef, beef tenderloin, shredded chicken or grilled chicken.'},{es:'Salchipapas Mixta',en:'Mixed Loaded Fries',price:18,descEs:'Papas fritas, salchicha, dos proteínas a elección, tocineta, maíz, queso rallado y salsas.',descEn:'French fries, sausage, two proteins of choice, bacon, corn, grated cheese and house sauces.'}]},
{title:{es:'🥤 Bebidas',en:'🥤 Drinks'},items:[{es:'Coca-Cola, Sprite, Fanta Naranja, Fanta Piña',en:'Coca-Cola, Sprite, Orange Fanta, Pineapple Fanta',price:2},{es:'Malta Polar, Frescolita Original, Frescolita Uva',en:'Malta Polar, Original Frescolita, Grape Frescolita',price:3}]}
];
function money(n){return '$'+n}function renderMenu(){const menu=document.getElementById('menu');menu.innerHTML='';sections.forEach(sec=>{const h=document.createElement('h2');h.className='title';h.textContent=sec.title[currentLang];menu.appendChild(h);const grid=document.createElement('div');grid.className='grid';sec.items.forEach(item=>{const card=document.createElement('div');card.className='card';const desc=currentLang==='es'?(item.descEs||''):(item.descEn||'');card.innerHTML=`<h3>${item[currentLang]}</h3><p class="price">${money(item.price)}</p>${desc?`<p class="small">${desc}</p>`:''}<button class="add" type="button">${currentLang==='es'?'Agregar al carrito':'Add to cart'}</button>`;card.querySelector('button').addEventListener('click',()=>addToCart(item));grid.appendChild(card)});menu.appendChild(grid);if(sec.note){const p=document.createElement('p');p.className='small';p.textContent=sec.note[currentLang];menu.appendChild(p)}});const c=document.createElement('section');c.innerHTML=`<h2 class="title">${currentLang==='es'?'📱 Contacto':'📱 Contact'}</h2><div class="card">📞 (469) 823-0192<br>📸 Instagram: @saborandinotx<br>👍 Facebook: SaborAndino Tex<br>💳 ${currentLang==='es'?'Efectivo · Tarjeta · Zelle · Cash App':'Cash · Card · Zelle · Cash App'}</div>`;menu.appendChild(c)}
function setLang(lang){currentLang=lang;document.documentElement.lang=lang;document.querySelectorAll('[data-es]').forEach(el=>{el.textContent=lang==='es'?el.getAttribute('data-es'):el.getAttribute('data-en')});renderMenu();renderCart()}function addToCart(item){cart.push(item);renderCart()}function removeFromCart(i){cart.splice(i,1);renderCart()}function clearCart(){cart=[];renderCart()}function renderCart(){const box=document.getElementById('cartItems');const total=cart.reduce((s,i)=>s+i.price,0);box.innerHTML=cart.length?'':`<p class="small">${currentLang==='es'?'Tu carrito está vacío.':'Your cart is empty.'}</p>`;cart.forEach((item,i)=>{const row=document.createElement('div');row.className='cart-row';row.innerHTML=`<span>${item[currentLang]} - ${money(item.price)}</span><button class="remove" type="button">X</button>`;row.querySelector('button').addEventListener('click',()=>removeFromCart(i));box.appendChild(row)});document.getElementById('total').textContent=money(total)}function sendWhatsApp(){if(cart.length===0){alert(currentLang==='es'?'Agrega productos al carrito primero.':'Add products to the cart first.');return}let msg=currentLang==='es'?'Hola, quiero realizar este pedido:%0A%0A':'Hello, I would like to place this order:%0A%0A';cart.forEach((item,i)=>{msg+=`${i+1}. ${item[currentLang]} - ${money(item.price)}%0A`});const total=cart.reduce((s,i)=>s+i.price,0);msg+=`%0ATotal: ${money(total)}`;window.open('https://wa.me/14698230192?text='+msg,'_blank')}setLang('es');
</script>
</body>
</html>
